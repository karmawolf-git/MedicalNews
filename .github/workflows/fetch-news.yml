name: Fetch News

on:
  schedule:
    - cron: "0 */3 * * *"   # 3시간마다 실행
  workflow_dispatch:          # 수동 실행 가능

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (scripts)
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout gh-pages (output)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: main
        run: npm install --no-save @xmldom/xmldom

      - name: Fetch news
        run: node main/scripts/fetch-news.js > gh-pages/news.json

      - name: Commit news.json
        working-directory: gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --staged --quiet || git commit -m "chore: update news.json [skip ci]"
          git push
