<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product News Hub</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #111318;
  --surface: #1c1f27;
  --surface2: #252830;
  --border: #2e3240;
  --text: #f0f2f8;
  --muted: #8b90a0;
  --accent: #e8303a;
  --accent2: #ff6b6b;
  --accent-grad: linear-gradient(135deg, #c0111a 0%, #e8303a 50%, #ff6060 100%);
  --error: #ff6b6b;
  --radius: 12px;
  --shadow: 0 2px 12px rgba(0,0,0,.4);
}
body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; background:var(--bg); color:var(--text); font-size:14px; line-height:1.6; }
a { color:inherit; text-decoration:none; }
button { cursor:pointer; font-family:inherit; }
input { font-family:inherit; color:var(--text); }

/* ── Header ── */
.header {
  position:sticky; top:0; z-index:100;
  background: var(--surface);
  border-bottom:1px solid var(--border);
  box-shadow: 0 4px 24px rgba(0,0,0,.5);
}
.header-inner { display:flex; align-items:center; gap:14px; padding:14px 24px; flex-wrap:wrap; }
.brand { display:flex; align-items:center; gap:10px; flex-shrink:0; }
.brand-icon {
  width:38px; height:38px; border-radius:10px;
  background: var(--accent-grad);
  display:flex; align-items:center; justify-content:center;
  font-size:20px; flex-shrink:0;
  box-shadow: 0 4px 12px rgba(232,48,58,.4);
}
.brand-text { display:flex; flex-direction:column; gap:1px; }
.brand-title { font-size:16px; font-weight:800; color:var(--text); letter-spacing:-.3px; }
.brand-sub { font-size:11px; color:var(--muted); }

.search-wrap { flex:1; min-width:160px; max-width:340px; position:relative; }
.search-wrap::before {
  content:"🔍"; position:absolute; left:12px; top:50%; transform:translateY(-50%);
  font-size:13px; pointer-events:none; opacity:.5;
}
.search-input {
  width:100%; padding:8px 14px 8px 34px;
  border:1px solid var(--border); border-radius:20px;
  font-size:13px; background:var(--surface2); outline:none;
  transition:border-color .2s, box-shadow .2s;
}
.search-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(232,48,58,.15); }
.search-input::placeholder { color:var(--muted); }

/* ── Filter rows ── */
.filter-row {
  display:flex; gap:6px; padding:8px 22px;
  overflow-x:auto; scrollbar-width:none;
  border-top:1px solid var(--border);
  background:var(--surface);
}
.filter-row::-webkit-scrollbar { display:none; }
.filter-row.type-row { padding-top:6px; padding-bottom:10px; border-top:none; }

.prod-btn {
  display:flex; flex-direction:column; align-items:center;
  padding:6px 16px; border-radius:20px;
  border:1px solid var(--border); background:transparent;
  font-size:12px; color:var(--muted); white-space:nowrap;
  transition:all .18s; line-height:1.3; flex-shrink:0;
}
.prod-btn .pname { font-weight:700; font-size:13px; }
.prod-btn .pgen  { font-size:10px; opacity:.6; }
.prod-btn:hover { border-color:var(--accent); color:var(--accent2); }
.prod-btn.active {
  background: var(--accent-grad);
  border-color:transparent; color:#fff;
  box-shadow:0 2px 10px rgba(232,48,58,.4);
}
.prod-btn.active .pgen { opacity:.85; }

.type-btn {
  padding:4px 14px; border-radius:14px;
  border:1px solid var(--border); background:transparent;
  font-size:12px; color:var(--muted); white-space:nowrap;
  transition:all .15s; flex-shrink:0;
}
.type-btn:hover { border-color:var(--accent); color:var(--accent2); }
.type-btn.active {
  background:rgba(232,48,58,.15); border-color:var(--accent);
  color:var(--accent2); font-weight:600;
}

/* ── Layout ── */
.layout { display:flex; }
.main { flex:1; min-width:0; padding:20px 24px; }

/* ── Feed bar ── */
.feed-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:8px; flex-wrap:wrap; }
.feed-count { font-size:13px; color:var(--muted); }
.feed-actions { display:flex; gap:8px; align-items:center; }
.err-badge {
  font-size:12px; color:var(--error); padding:4px 12px;
  border-radius:12px; border:1px solid rgba(255,107,107,.4);
  background:rgba(255,107,107,.08); cursor:help;
}
.reload-btn {
  padding:6px 16px; border-radius:14px;
  border:1px solid var(--border); background:var(--surface2);
  font-size:13px; color:var(--text);
  transition:all .15s;
}
.reload-btn:hover:not(:disabled) { border-color:var(--accent); color:var(--accent2); }
.reload-btn:disabled { opacity:.4; cursor:not-allowed; }

.notice {
  background:rgba(255,200,0,.07); border:1px solid rgba(255,200,0,.25);
  border-radius:var(--radius); padding:10px 14px; margin-bottom:16px;
  font-size:13px; color:#fbbf24; display:none;
}

/* ── Grid ── */
.article-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
.skeleton-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
.skeleton {
  height:160px; border-radius:var(--radius);
  background:linear-gradient(90deg,var(--surface2) 25%,var(--surface) 50%,var(--surface2) 75%);
  background-size:200% 100%; animation:shimmer 1.4s infinite;
}
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

/* ── Card ── */
.card {
  display:flex; flex-direction:column; gap:8px; padding:16px;
  border-radius:var(--radius); border:1px solid var(--border);
  background:var(--surface); box-shadow:var(--shadow);
  transition:box-shadow .18s, border-color .18s, transform .15s;
  position:relative; overflow:hidden;
}
.card::before {
  content:"뉴스"; position:absolute; top:12px; right:12px;
  font-size:10px; font-weight:700; padding:2px 8px; border-radius:8px;
  background:var(--accent-grad); color:#fff; letter-spacing:.3px;
}
.card:hover {
  box-shadow:0 8px 28px rgba(0,0,0,.5);
  border-color:var(--accent);
  transform:translateY(-2px);
}
.card-meta { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); padding-right:40px; }
.card-source { font-weight:600; }
.card-title { font-size:14px; font-weight:700; line-height:1.5; color:var(--text); }
.card-desc { font-size:12px; color:var(--muted); line-height:1.55; }
.card-footer { display:flex; gap:4px; flex-wrap:wrap; margin-top:auto; padding-top:4px; }
.tag-prod { font-size:10px; padding:2px 8px; border-radius:8px; font-weight:700; }
.tag-type { font-size:10px; padding:2px 8px; border-radius:8px; background:rgba(34,197,94,.12); color:#4ade80; }
.tag-class { font-size:10px; padding:2px 8px; border-radius:8px; background:rgba(167,139,250,.12); color:#a78bfa; }

/* ── Legend ── */
.prod-legend { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:14px; }
.legend-chip {
  font-size:11px; padding:3px 11px; border-radius:10px;
  border:1px solid; opacity:.85;
}

/* ── Empty ── */
.empty { text-align:center; padding:60px 20px; color:var(--muted); font-size:14px; }

@media(max-width:768px){
  .brand-sub { display:none; }
  .main { padding:14px; }
  .article-grid { grid-template-columns:1fr; }
  .header-inner { padding:12px 16px; }
  .filter-row { padding:8px 14px; }
}
</style>
</head>

    const btn=document.createElement("button");
    btn.className="prod-btn"+(p.id===activeProd?" active":"");
    btn.innerHTML=`<span class="pname">${p.name}</span><span class="pgen">${p.generic}</span>`;
    btn.onclick=()=>{activeProd=p.id;renderProdBar();renderFeed();renderLegend();};
    bar.appendChild(btn);
  });
}

function renderTypeBar(){
  const bar=document.getElementById("typeBar"); bar.innerHTML="";
  TYPES.forEach(t=>{
    const btn=document.createElement("button");
    btn.className="type-btn"+(t.id===activeType?" active":"");
    btn.textContent=t.label;
    btn.onclick=()=>{activeType=t.id;renderTypeBar();renderFeed();};
    bar.appendChild(btn);
  });
}

function renderLegend(){
  const el=document.getElementById("prodLegend"); el.innerHTML="";
  const prods=activeProd==="all"?PRODUCTS.slice(1):PRODUCTS.filter(p=>p.id===activeProd);
  prods.forEach(p=>{
    const c=document.createElement("span");
    c.className="legend-chip";
    c.style.cssText=`background:${p.color};color:${p.textColor};border-color:${p.color}`;
    c.textContent=`${p.name} (${p.generic}) · ${p.classLabel}`;
    el.appendChild(c);
  });
}

// ══════════════════════════════════════════════════════════
//  키워드 매칭
// ══════════════════════════════════════════════════════════
function includes(text, kws){ const t=text.toLowerCase(); return kws.some(k=>t.includes(k.toLowerCase())); }

function detectProds(text){
  return PRODUCTS.slice(1).filter(p=>
    includes(text,[...p.brandKw,...p.classKw,...p.competKw,...p.diseaseKw])
  );
}
function detectClasses(text){
  return PRODUCTS.slice(1).filter(p=>includes(text,[...p.classKw,...p.competKw]));
}
function detectType(text){
  // 각 유형 키워드 히트 수를 카운트해 가장 많이 매칭된 유형 선택
  const scores = TYPES.slice(1).map(t=>({
    id: t.id,
    score: t.kw.filter(k=>text.includes(k.toLowerCase())).length
  }));
  const best = scores.reduce((a,b)=>a.score>=b.score?a:b);
  return best.score>0 ? best.id : "disease";
}

// ══════════════════════════════════════════════════════════
//  뉴스 로드 — GitHub Actions가 3시간마다 생성한 news.json 사용
//  (CORS 프록시 불필요, 빠르고 안정적)
// ══════════════════════════════════════════════════════════
async function loadFeeds(){
  errors={};
  document.getElementById("feedArea").innerHTML=`<div class="skeleton-grid">${Array(6).fill('<div class="skeleton"></div>').join("")}</div>`;
  document.getElementById("reloadBtn").disabled=true;
  document.getElementById("feedCount").textContent="로딩 중...";
  document.getElementById("noticeBanner").style.display="none";

  try{
    const r=await fetch("news.json?v="+Date.now());
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const data=await r.json();

    const raw=(data.articles||[]).map(a=>{
      const title=(a.title||"").replace(/\s*-\s*[^-]+$/, "").trim(); // "제목 - 출처" → "제목"만
      const desc=a.desc||"";
      const full=(title+" "+desc).toLowerCase();
      return {
        id:a.link, title, link:a.link, desc,
        date: a.pubDate?new Date(a.pubDate):new Date(),
        sourceId:a.sourceId, sourceName:a.sourceName||"", country:a.country,
        searchText: (title+" "+desc+" "+(a.sourceName||"")).toLowerCase(),
        matchedProds: detectProds(full),
        matchedClasses: detectClasses(full),
        articleType: detectType(full),
      };
    }).filter(a=>a.title&&a.link);

    const seen=new Set();
    articles=raw.filter(a=>{ if(seen.has(a.link)) return false; seen.add(a.link); return true; });
    lastUpdated=data.updatedAt?new Date(data.updatedAt):new Date();

    if(!articles.length){
      document.getElementById("noticeBanner").style.display="";
      document.getElementById("noticeBanner").textContent="뉴스 데이터가 아직 없습니다. GitHub Actions가 실행된 후 새로고침해 주세요.";
    }
  }catch(e){
    document.getElementById("noticeBanner").style.display="";
    document.getElementById("noticeBanner").textContent=`⚠ news.json 로드 실패: ${e.message}`;
  }

  renderFeed();
}

// ══════════════════════════════════════════════════════════
//  Render Feed
// ══════════════════════════════════════════════════════════
function timeAgo(d){
  const s=(Date.now()-d.getTime())/1000;
  if(isNaN(s)||s<0) return "";
  if(s<60) return "방금 전";
  if(s<3600) return Math.floor(s/60)+"분 전";
  if(s<86400) return Math.floor(s/3600)+"시간 전";
  return Math.floor(s/86400)+"일 전";
}

function renderFeed(){
  const ec=Object.keys(errors).length;
  const eb=document.getElementById("errBadge");
  if(ec){
    eb.style.display=""; eb.textContent=`⚠ ${ec}개 소스 오류`;
    eb.title=Object.entries(errors).map(([k,v])=>`${k}: ${v}`).join("\n");
  } else eb.style.display="none";

  // 제품 탭 필터링
  // - 전용 소스(prod===activeProd): 그대로 포함
  // - 공통 소스(prod==="all"): 특정 제품 탭에서는 해당 제품 키워드와 매칭되는 기사만 포함
  const strictSourceIds = new Set(SOURCES.filter(s=>s.prod===activeProd).map(s=>s.id));
  const allSourceIds    = new Set(SOURCES.filter(s=>s.prod==="all").map(s=>s.id));
  const activeProdObj   = PRODUCTS.find(p=>p.id===activeProd);
  const activeProdKw    = activeProdObj
    ? [...(activeProdObj.brandKw||[]),...(activeProdObj.classKw||[]),...(activeProdObj.competKw||[]),...(activeProdObj.diseaseKw||[])]
    : [];

  let list=articles.filter(a=>{
    if(activeProd==="all") return true;
    if(strictSourceIds.has(a.sourceId)) return true;
    if(allSourceIds.has(a.sourceId)){
      // 공통 소스 기사는 해당 제품 키워드와 실제 매칭될 때만 포함
      return includes((a.title+" "+a.desc).toLowerCase(), activeProdKw);
    }
    return false;
  });

  if(activeType!=="all"){
    list=list.filter(a=>a.articleType===activeType);
  }
  if(searchQuery.trim()){
    const q=searchQuery.toLowerCase();
    list=list.filter(a=>(a.searchText||a.title.toLowerCase()).includes(q));
  }

  const upd=lastUpdated?` · ${lastUpdated.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})} 업데이트`:"";
  document.getElementById("feedCount").textContent=`${list.length}개 기사${upd}`;
  document.getElementById("reloadBtn").disabled=false;

  const area=document.getElementById("feedArea");
  if(!list.length){
    area.innerHTML=`<div class="empty">조건에 맞는 기사가 없습니다.<br><small>다른 제품·유형 탭을 선택하거나 새로고침해 보세요.</small></div>`;
    return;
  }

  const grid=document.createElement("div"); grid.className="article-grid";
  const FLAGS={KR:"🇰🇷",US:"🇺🇸"};
  // 소스 id → prod 맵
  const srcProdMap=Object.fromEntries(SOURCES.map(s=>[s.id,s.prod]));
  list.forEach(a=>{
    const typeLabel=TYPES.find(t=>t.id===a.articleType)?.label??"";
    // 소스의 prod로 제품 태그 결정 (더 정확)
    const srcProd=srcProdMap[a.sourceId];
    const prodObj=srcProd&&srcProd!=="all"?PRODUCTS.find(p=>p.id===srcProd):null;
    const prodTags=prodObj
      ?`<span class="tag-prod" style="background:${prodObj.color};color:${prodObj.textColor}">${prodObj.name}</span>`
      :(a.matchedProds||[]).slice(0,2).map(p=>`<span class="tag-prod" style="background:${p.color};color:${p.textColor}">${p.name}</span>`).join("");
    const classTags=prodObj
      ?`<span class="tag-class">${prodObj.classLabel}</span>`
      :(a.matchedClasses||[]).slice(0,1).map(p=>`<span class="tag-class">${p.classLabel}</span>`).join("");
    const card=document.createElement("a");
    card.className="card";
    card.href=a.link; card.target="_blank"; card.rel="noopener noreferrer";
    card.innerHTML=`
      <div class="card-meta">
        <span class="card-source">${FLAGS[a.country]||""} ${a.sourceName}</span>
        <span>${timeAgo(a.date)}</span>
      </div>
      <div class="card-title">${a.title}</div>
      ${a.desc?`<div class="card-desc">${a.desc}…</div>`:""}
      <div class="card-footer">
        ${prodTags}${classTags}
        ${typeLabel?`<span class="tag-type">${typeLabel}</span>`:""}
      </div>
    `;
    grid.appendChild(card);
  });
  area.innerHTML=""; area.appendChild(grid);
}

</script>
