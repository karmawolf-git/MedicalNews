<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product News Hub</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f1f4f9;
  --surface: #ffffff;
  --surface2: #f8fafc;
  --border: #e2e8f0;
  --text: #1e293b;
  --muted: #64748b;
  --accent: #3b82f6;
  --error: #ef4444;
  --radius: 12px;
  --shadow: 0 1px 6px rgba(0,0,0,.08);
  --shadow-md: 0 4px 16px rgba(0,0,0,.1);
}
body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; background:var(--bg); color:var(--text); font-size:14px; line-height:1.6; }
a { color:inherit; text-decoration:none; }
button { cursor:pointer; font-family:inherit; }
input { font-family:inherit; color:var(--text); }

/* ── Header ── */
.header { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); box-shadow:var(--shadow); flex-shrink:0; }
.header-inner { display:flex; align-items:center; gap:14px; padding:12px 24px; flex-wrap:wrap; }
.brand { display:flex; align-items:center; gap:10px; flex-shrink:0; }
.brand-icon {
  width:36px; height:36px; border-radius:10px;
  display:flex; align-items:center; justify-content:center;
  font-size:18px; flex-shrink:0;
  background:linear-gradient(135deg,#3b82f6,#6366f1);
  box-shadow:0 3px 10px rgba(99,102,241,.3);
}
.brand-text { display:flex; flex-direction:column; gap:1px; }
.brand-title { font-size:16px; font-weight:800; color:var(--text); letter-spacing:-.3px; }
.brand-sub { font-size:11px; color:var(--muted); }

.search-wrap { flex:1; min-width:160px; max-width:340px; position:relative; }
.search-wrap::before { content:"🔍"; position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:13px; pointer-events:none; opacity:.45; }
.search-input {
  width:100%; padding:8px 14px 8px 34px;
  border:1px solid var(--border); border-radius:20px;
  font-size:13px; background:var(--surface2); outline:none;
  transition:border-color .2s, box-shadow .2s;
}
.search-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(59,130,246,.12); }
.search-input::placeholder { color:var(--muted); }

.feed-meta { display:flex; align-items:center; gap:8px; flex-shrink:0; }
.feed-count { font-size:12px; color:var(--muted); }
.err-badge { font-size:12px; color:var(--error); padding:3px 10px; border-radius:10px; border:1px solid rgba(239,68,68,.3); background:#fef2f2; cursor:help; }
.reload-btn { padding:5px 14px; border-radius:14px; border:1px solid var(--border); background:var(--surface); font-size:12px; color:var(--text); transition:all .15s; }
.reload-btn:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); background:#eff6ff; }
.reload-btn:disabled { opacity:.4; cursor:not-allowed; }

/* ── Filter rows ── */
.filter-row { display:flex; gap:6px; padding:8px 22px; overflow-x:auto; scrollbar-width:none; border-top:1px solid var(--border); background:var(--surface); }
.filter-row::-webkit-scrollbar { display:none; }
.filter-row.type-row { padding-top:6px; padding-bottom:10px; border-top:none; }

.prod-btn {
  display:flex; align-items:center; gap:7px;
  padding:6px 14px; border-radius:20px;
  border:1.5px solid var(--border); background:var(--surface);
  font-size:13px; font-weight:600; color:var(--muted);
  white-space:nowrap; transition:all .18s; flex-shrink:0;
}
.prod-btn .p-icon {
  width:22px; height:22px; border-radius:7px;
  display:flex; align-items:center; justify-content:center;
  font-size:13px; flex-shrink:0;
}
.prod-btn:hover { border-color:currentColor; }
.prod-btn.active { color:#fff !important; border-color:transparent; box-shadow:var(--shadow-md); }

.type-btn { padding:4px 14px; border-radius:14px; border:1px solid var(--border); background:transparent; font-size:12px; color:var(--muted); white-space:nowrap; transition:all .15s; flex-shrink:0; }
.type-btn:hover { border-color:var(--accent); color:var(--accent); }
.type-btn.active { background:#eff6ff; border-color:var(--accent); color:var(--accent); font-weight:600; }

/* ── Main content ── */
.main { max-width:1200px; margin:0 auto; padding:24px 28px; }

/* ── Feed bar ── */
.feed-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; gap:8px; flex-wrap:wrap; border-bottom:2px solid var(--text); padding-bottom:10px; }
.feed-bar-left { display:flex; align-items:baseline; gap:12px; }
.feed-section-title { font-size:18px; font-weight:900; letter-spacing:-.5px; text-transform:uppercase; }
.feed-count { font-size:12px; color:var(--muted); }

/* ── Skeleton ── */
.skeleton-magazine { display:grid; grid-template-columns:2fr 1fr; gap:20px; }
.skeleton-row { border-radius:var(--radius); background:linear-gradient(90deg,#e2e8f0 25%,#f8fafc 50%,#e2e8f0 75%); background-size:200% 100%; animation:shimmer 1.4s infinite; }
.skeleton-hero { height:360px; }
.skeleton-side { display:flex; flex-direction:column; gap:12px; }
.skeleton-card { height:100px; }
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

/* ══ Magazine grid ══ */
.mag-grid {
  display:grid;
  grid-template-columns:repeat(12, 1fr);
  gap:20px;
}

/* Hero — spans 6 cols */
.mag-hero {
  grid-column: span 6;
  display:flex; flex-direction:column;
  background:var(--surface); border-radius:var(--radius);
  border:1px solid var(--border); box-shadow:var(--shadow-md);
  overflow:hidden; transition:box-shadow .2s, transform .15s;
  text-decoration:none; color:inherit;
}
.mag-hero:hover { box-shadow:0 8px 32px rgba(0,0,0,.14); transform:translateY(-2px); }

.hero-thumb {
  height:110px; position:relative; overflow:hidden;
  display:flex; align-items:flex-end;
}
.hero-thumb-bg {
  position:absolute; inset:0; opacity:.12;
  background-size:cover; background-position:center;
}
.hero-thumb-gradient {
  position:absolute; inset:0;
}
.hero-badge {
  position:relative; z-index:1;
  margin:10px; display:flex; gap:6px; flex-wrap:wrap;
}
.hero-body { padding:14px 18px 16px; flex:1; display:flex; flex-direction:column; gap:8px; }
.hero-title { font-size:16px; font-weight:800; line-height:1.4; color:var(--text); }
.hero-desc { font-size:13px; color:#475569; line-height:1.65;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; flex:1; }
.hero-meta { display:flex; gap:8px; font-size:12px; color:var(--muted); align-items:center; margin-top:auto; }
.hero-source { font-weight:700; color:var(--text); }

/* Side stack — 6 cols */
.mag-side {
  grid-column: span 6;
  display:flex; flex-direction:column; gap:14px;
}

/* Side card */
.mag-side-card {
  display:flex; flex-direction:column; gap:7px;
  padding:14px 16px;
  background:var(--surface); border-radius:var(--radius);
  border:1px solid var(--border); box-shadow:var(--shadow);
  border-left:4px solid;
  overflow:hidden; transition:box-shadow .18s, transform .12s;
  text-decoration:none; color:inherit;
}
.mag-side-card:hover { box-shadow:var(--shadow-md); transform:translateY(-1px); }
.side-title { font-size:13px; font-weight:700; line-height:1.45; color:var(--text);
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.side-desc { font-size:12px; color:var(--muted); line-height:1.55;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.side-meta { display:flex; gap:6px; font-size:11px; color:var(--muted); align-items:center; }
.side-source { font-weight:700; color:var(--text); }

/* ── Divider row label ── */
.mag-divider {
  grid-column: span 12;
  display:flex; align-items:center; gap:12px;
  font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);
  margin-top:4px;
}
.mag-divider::after { content:""; flex:1; height:1px; background:var(--border); }

/* Standard card — 4 cols */
.mag-card {
  grid-column: span 4;
  display:flex; flex-direction:column; gap:8px;
  padding:16px 18px;
  background:var(--surface); border-radius:var(--radius);
  border:1px solid var(--border); box-shadow:var(--shadow);
  overflow:hidden; transition:box-shadow .18s, transform .12s;
  text-decoration:none; color:inherit; position:relative;
}
.mag-card:hover { box-shadow:var(--shadow-md); transform:translateY(-2px); }
.card-top-bar { height:3px; border-radius:3px 3px 0 0; margin:-16px -18px 10px; }
.card-title { font-size:14px; font-weight:700; line-height:1.45; color:var(--text);
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.card-desc { font-size:12px; color:var(--muted); line-height:1.6;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; flex:1; }
.card-meta { display:flex; gap:6px; font-size:11px; color:var(--muted); align-items:center; margin-top:auto; padding-top:6px; }
.card-source { font-weight:700; color:var(--text); }
.card-tags { display:flex; gap:4px; flex-wrap:wrap; }

/* Tags */
.tag-prod { font-size:10px; padding:2px 8px; border-radius:6px; font-weight:700; }
.tag-type { font-size:10px; padding:2px 8px; border-radius:6px; background:#f0fdf4; color:#15803d; }
.tag-class { font-size:10px; padding:2px 8px; border-radius:6px; background:#f5f3ff; color:#6d28d9; }

/* ── Notice ── */
.notice-bar { background:#fffbeb; border-bottom:1px solid #fde68a; padding:8px 24px; font-size:12px; color:#92400e; display:none; }

/* ── Empty ── */
.empty { text-align:center; padding:80px 20px; color:var(--muted); font-size:14px; }

@media(max-width:768px){
  .mag-hero { grid-column:span 12; }
  .mag-side { grid-column:span 12; flex-direction:row; flex-wrap:wrap; }
  .mag-side-card { flex:1; min-width:220px; }
  .mag-card { grid-column:span 6; }
}
@media(max-width:768px){
  .main { padding:14px; }
  .mag-card { grid-column:span 12; }
  .mag-side-card { min-width:100%; }
  .brand-sub { display:none; }
  .header-inner { padding:10px 14px; }
  .filter-row { padding:8px 12px; }
}
</style>
</head>
<body>

  { id:"all",      label:"전체 유형" },
  { id:"disease",  label:"질환/임상",  kw:["임상","치료","환자","질환","증상","처방","적응증","부작용","안전성","효능","clinical","trial","patient","disease","efficacy","safety","adverse","치료제","요법","처방전"] },
  { id:"policy",   label:"정책/규제",  kw:["급여","허가","식약처","fda","ema","보험","정책","규제","심평원","급여기준","승인","약가","보험급여","approval","reimbursement","regulation","guideline","가이드라인","급여확대","비급여"] },
  { id:"research", label:"연구/학술",  kw:["연구","학술","논문","발표","결과","데이터","메타분석","리얼월드","real-world","study","research","journal","published","meta-analysis","rwe","rct","randomized","무작위","코호트","cohort"] },
];

const SOURCES = [
  { id:"gn_lipitor_kr",     prod:"lipitor"     },
  { id:"gn_statin_en",      prod:"lipitor"     },
  { id:"gn_lipitorplus_kr", prod:"lipitorplus" },
  { id:"gn_lipitorplus_en", prod:"lipitorplus" },
  { id:"gn_norvasc_kr",     prod:"norvasc"     },
  { id:"gn_htn_en",         prod:"norvasc"     },
  { id:"gn_lyrica_kr",      prod:"lyrica"      },
  { id:"gn_neuro_en",       prod:"lyrica"      },
  { id:"gn_celebrex_kr",    prod:"celebrex"    },
  { id:"gn_arthritis_en",   prod:"celebrex"    },
  { id:"gn_caduet_kr",      prod:"caduet"      },
  { id:"gn_caduet_en",      prod:"caduet"      },
  { id:"gn_policy_kr",      prod:"all"         },
  { id:"gn_policy_en",      prod:"all"         },
];

// ══════════════════════════════════════════════════════════
//  State
// ══════════════════════════════════════════════════════════
let activeProd="all", activeType="all", searchQuery="";
let articles=[], errors={}, lastUpdated=null;

// ══════════════════════════════════════════════════════════
//  Init
// ══════════════════════════════════════════════════════════
renderProdBar(); renderTypeBar();
loadFeeds();

document.getElementById("searchInput").addEventListener("input",e=>{searchQuery=e.target.value;renderFeed();});
document.getElementById("reloadBtn").addEventListener("click",loadFeeds);

// ══════════════════════════════════════════════════════════
//  Render filters
// ══════════════════════════════════════════════════════════
function renderProdBar(){
  const bar=document.getElementById("prodBar"); bar.innerHTML="";
  PRODUCTS.forEach(p=>{
    const isActive=p.id===activeProd;
    const btn=document.createElement("button");
    btn.className="prod-btn"+(isActive?" active":"");
    if(isActive && p.iconBg) btn.style.background=p.iconBg;
    if(!isActive && p.textColor){
      btn.style.color=p.textColor;
      btn.style.borderColor=p.color||"";
      btn.style.background=p.color||"";
    }
    btn.innerHTML=`<span class="p-icon" style="background:${p.iconBg||"#e2e8f0"}">${p.icon||"💊"}</span>${p.name}`;
    btn.onclick=()=>{activeProd=p.id;renderProdBar();renderFeed();};
    bar.appendChild(btn);
  });
}

function renderTypeBar(){
  const bar=document.getElementById("typeBar"); bar.innerHTML="";
  TYPES.forEach(t=>{
    const btn=document.createElement("button");
    btn.className="type-btn"+(t.id===activeType?" active":"");
    btn.textContent=t.label;
    btn.onclick=()=>{activeType=t.id;renderTypeBar();renderFeed();};
    bar.appendChild(btn);
  });
}

// ══════════════════════════════════════════════════════════
//  키워드 매칭
// ══════════════════════════════════════════════════════════
function includes(text, kws){ const t=text.toLowerCase(); return kws.some(k=>t.includes(k.toLowerCase())); }

function detectProds(text){
  return PRODUCTS.slice(1).filter(p=>
    includes(text,[...p.brandKw,...p.classKw,...p.competKw,...p.diseaseKw])
  );
}
function detectClasses(text){
  return PRODUCTS.slice(1).filter(p=>includes(text,[...p.classKw,...p.competKw]));
}
function detectType(text){
  const scores = TYPES.slice(1).map(t=>({
    id: t.id,
    score: t.kw.filter(k=>text.includes(k.toLowerCase())).length
  }));
  const best = scores.reduce((a,b)=>a.score>=b.score?a:b);
  return best.score>0 ? best.id : "disease";
}

// ══════════════════════════════════════════════════════════
//  뉴스 로드
// ══════════════════════════════════════════════════════════
async function loadFeeds(){
  errors={};
  document.getElementById("feedArea").innerHTML=`<div class="skeleton-magazine"><div class="skeleton-row skeleton-hero"></div><div class="skeleton-side">${Array(4).fill('<div class="skeleton-row skeleton-card"></div>').join("")}</div></div>`;
  document.getElementById("reloadBtn").disabled=true;
  document.getElementById("feedCount").textContent="로딩 중...";
  document.getElementById("noticeBanner").style.display="none";

  try{
    const r=await fetch("news.json?v="+Date.now());
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const data=await r.json();

    const raw=(data.articles||[]).map(a=>{
      const title=(a.title||"").replace(/\s*-\s*[^-]+$/, "").trim();
      const desc=a.desc||"";
      const full=(title+" "+desc).toLowerCase();
      return {
        id:a.link, title, link:a.link, desc,
        date: a.pubDate?new Date(a.pubDate):new Date(),
        sourceId:a.sourceId, sourceName:a.sourceName||"", country:a.country,
        searchText: (title+" "+desc+" "+(a.sourceName||"")).toLowerCase(),
        matchedProds: detectProds(full),
        matchedClasses: detectClasses(full),
        articleType: detectType(full),
      };
    }).filter(a=>a.title&&a.link);

    const seen=new Set();
    articles=raw.filter(a=>{ if(seen.has(a.link)) return false; seen.add(a.link); return true; });
    lastUpdated=data.updatedAt?new Date(data.updatedAt):new Date();

    if(!articles.length){
      showNotice("뉴스 데이터가 아직 없습니다. GitHub Actions가 실행된 후 새로고침해 주세요.");
    }
  }catch(e){
    showNotice(`⚠ news.json 로드 실패: ${e.message}`);
  }

  renderFeed();
}

function showNotice(msg){
  const el=document.getElementById("noticeBanner");
  el.textContent=msg; el.style.display="";
}

// ══════════════════════════════════════════════════════════
//  Render Feed
// ══════════════════════════════════════════════════════════
function timeAgo(d){
  const s=(Date.now()-d.getTime())/1000;
  if(isNaN(s)||s<0) return "";
  if(s<60) return "방금 전";
  if(s<3600) return Math.floor(s/60)+"분 전";
  if(s<86400) return Math.floor(s/3600)+"시간 전";
  return Math.floor(s/86400)+"일 전";
}

function filterArticles(){
  const strictSourceIds = new Set(SOURCES.filter(s=>s.prod===activeProd).map(s=>s.id));
  const allSourceIds    = new Set(SOURCES.filter(s=>s.prod==="all").map(s=>s.id));
  const activeProdObj   = PRODUCTS.find(p=>p.id===activeProd);
  const activeProdKw    = activeProdObj
    ? [...(activeProdObj.brandKw||[]),...(activeProdObj.classKw||[]),...(activeProdObj.competKw||[]),...(activeProdObj.diseaseKw||[])]
    : [];

  let list=articles.filter(a=>{
    if(activeProd==="all") return true;
    if(strictSourceIds.has(a.sourceId)) return true;
    if(allSourceIds.has(a.sourceId)){
      return includes((a.title+" "+a.desc).toLowerCase(), activeProdKw);
    }
    return false;
  });

  if(activeType!=="all") list=list.filter(a=>a.articleType===activeType);
  if(searchQuery.trim()){
    const q=searchQuery.toLowerCase();
    list=list.filter(a=>(a.searchText||a.title.toLowerCase()).includes(q));
  }
  return list;
}

const srcProdMap=Object.fromEntries(SOURCES.map(s=>[s.id,s.prod]));
const FLAGS={KR:"🇰🇷",US:"🇺🇸"};

function makeTags(a, prodObj){
  const typeLabel=TYPES.find(t=>t.id===a.articleType)?.label??"";
  const prodTags=prodObj
    ?`<span class="tag-prod" style="background:${prodObj.color};color:${prodObj.textColor}">${prodObj.name}</span>`
    :(a.matchedProds||[]).slice(0,2).map(p=>`<span class="tag-prod" style="background:${p.color};color:${p.textColor}">${p.name}</span>`).join("");
  const classTags=prodObj
    ?`<span class="tag-class">${prodObj.classLabel}</span>`
    :(a.matchedClasses||[]).slice(0,1).map(p=>`<span class="tag-class">${p.classLabel}</span>`).join("");
  return prodTags+classTags+(typeLabel?`<span class="tag-type">${typeLabel}</span>`:"");
}

function renderFeed(){
  const ec=Object.keys(errors).length;
  const eb=document.getElementById("errBadge");
  if(ec){ eb.style.display=""; eb.textContent=`⚠ ${ec}개 소스 오류`; eb.title=Object.entries(errors).map(([k,v])=>`${k}: ${v}`).join("\n"); }
  else eb.style.display="none";

  const list=filterArticles();

  const upd=lastUpdated?` · ${lastUpdated.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})} 업데이트`:"";
  document.getElementById("feedCount").textContent=`${list.length}개 기사${upd}`;
  document.getElementById("reloadBtn").disabled=false;

  const activeProdObj=PRODUCTS.find(p=>p.id===activeProd);
  document.getElementById("sectionTitle").textContent=activeProdObj?.name==="전체"?"최신 뉴스":(activeProdObj?.name||"최신 뉴스")+" 뉴스";

  const area=document.getElementById("feedArea");
  if(!list.length){
    area.innerHTML=`<div class="empty">조건에 맞는 기사가 없습니다.<br><small>다른 제품·유형 탭을 선택하거나 새로고침해 보세요.</small></div>`;
    return;
  }

  const grid=document.createElement("div");
  grid.className="mag-grid";

  // ── Hero + side stack (first 5) ──
  const hero=list[0];
  const sides=list.slice(1,5);

  const heroProd=PRODUCTS.find(p=>p.id===srcProdMap[hero.sourceId])||null;
  const heroBg=heroProd?.iconBg||"linear-gradient(135deg,#3b82f6,#6366f1)";
  const heroEl=document.createElement("a");
  heroEl.className="mag-hero";
  heroEl.href=hero.link; heroEl.target="_blank"; heroEl.rel="noopener noreferrer";
  heroEl.innerHTML=`
    <div class="hero-thumb" style="">
      <div class="hero-thumb-gradient" style="background:${heroBg};opacity:.18"></div>
      <div class="hero-thumb-gradient" style="background:linear-gradient(to top,rgba(255,255,255,.95) 0%,transparent 60%)"></div>
      <div class="hero-badge">${makeTags(hero,heroProd)}</div>
    </div>
    <div class="hero-body">
      <div class="hero-title">${hero.title}</div>
      ${hero.desc?`<div class="hero-desc">${hero.desc}</div>`:""}
      <div class="hero-meta">
        <span class="hero-source">${FLAGS[hero.country]||""} ${hero.sourceName}</span>
        <span>·</span><span>${timeAgo(hero.date)}</span>
      </div>
    </div>
  `;
  grid.appendChild(heroEl);

  const sideEl=document.createElement("div");
  sideEl.className="mag-side";
  sides.forEach(a=>{
    const prodObj=PRODUCTS.find(p=>p.id===srcProdMap[a.sourceId])||null;
    const borderColor=prodObj?.color||"#e2e8f0";
    const card=document.createElement("a");
    card.className="mag-side-card";
    card.href=a.link; card.target="_blank"; card.rel="noopener noreferrer";
    card.style.borderLeftColor=borderColor;
    card.innerHTML=`
      <div class="side-title">${a.title}</div>
      ${a.desc?`<div class="side-desc">${a.desc}</div>`:""}
      <div class="side-meta">
        <span class="side-source">${FLAGS[a.country]||""} ${a.sourceName}</span>
        <span>·</span><span>${timeAgo(a.date)}</span>
      </div>
    `;
    sideEl.appendChild(card);
  });
  grid.appendChild(sideEl);

  // ── Rest as 3-col cards ──
  const rest=list.slice(5);
  if(rest.length){
    const div=document.createElement("div");
    div.className="mag-divider"; div.textContent="더 많은 기사";
    grid.appendChild(div);

    rest.forEach(a=>{
      const prodObj=PRODUCTS.find(p=>p.id===srcProdMap[a.sourceId])||null;
      const accentBg=prodObj?.iconBg||"linear-gradient(135deg,#94a3b8,#64748b)";
      const card=document.createElement("a");
      card.className="mag-card";
      card.href=a.link; card.target="_blank"; card.rel="noopener noreferrer";
      card.innerHTML=`
        <div class="card-top-bar" style="background:${accentBg}"></div>
        <div class="card-title">${a.title}</div>
        ${a.desc?`<div class="card-desc">${a.desc}</div>`:""}
        <div class="card-meta">
          <span class="card-source">${FLAGS[a.country]||""} ${a.sourceName}</span>
          <span>·</span><span>${timeAgo(a.date)}</span>
        </div>
        <div class="card-tags">${makeTags(a,prodObj)}</div>
      `;
      grid.appendChild(card);
    });
  }

  area.innerHTML="";
  area.appendChild(grid);
}
</script>
