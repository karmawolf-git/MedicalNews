<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pfizer Product News Hub</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f4f6fb; --surface: #fff; --border: #e2e8f0;
  --text: #1e293b; --muted: #64748b;
  --accent: #0050a0; --accent-light: #e8f0fb;
  --tag-bg: #e0f2fe; --tag-color: #0369a1;
  --error: #ef4444; --radius: 10px; --shadow: 0 1px 4px rgba(0,0,0,.08);
}
body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; background:var(--bg); color:var(--text); font-size:14px; line-height:1.6; }
a { color:inherit; text-decoration:none; }
button { cursor:pointer; font-family:inherit; }
input { font-family:inherit; }

/* ── Header ── */
.header { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); box-shadow:var(--shadow); }
.header-inner { display:flex; align-items:center; gap:14px; padding:12px 20px; flex-wrap:wrap; }
.brand { display:flex; align-items:center; gap:8px; flex-shrink:0; }
.brand-icon { font-size:22px; }
.brand-title { font-size:17px; font-weight:700; color:var(--accent); }
.brand-sub { font-size:12px; color:var(--muted); }
.search-wrap { flex:1; min-width:160px; max-width:320px; }
.search-input { width:100%; padding:7px 14px; border:1px solid var(--border); border-radius:20px; font-size:14px; background:var(--bg); outline:none; }
.search-input:focus { border-color:var(--accent); }
.sidebar-toggle { padding:6px 13px; border-radius:20px; border:1px solid var(--border); background:var(--bg); font-size:13px; color:var(--muted); white-space:nowrap; }
.sidebar-toggle:hover { background:var(--border); }

/* ── Product tabs (row 1) ── */
.filter-row { display:flex; gap:6px; padding:8px 20px; overflow-x:auto; border-top:1px solid var(--border); scrollbar-width:none; }
.filter-row::-webkit-scrollbar { display:none; }
.filter-row + .filter-row { padding-top:4px; padding-bottom:10px; border-top:none; }

.prod-btn { display:flex; flex-direction:column; align-items:center; padding:6px 14px; border-radius:16px; border:1px solid var(--border); background:transparent; font-size:12px; color:var(--muted); white-space:nowrap; transition:all .15s; line-height:1.3; }
.prod-btn .pname { font-weight:700; font-size:13px; }
.prod-btn .pgen  { font-size:10px; opacity:.75; }
.prod-btn:hover { border-color:var(--accent); color:var(--accent); }
.prod-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }
.prod-btn.active .pgen { opacity:.85; }

/* ── Type tabs (row 2) ── */
.type-btn { padding:4px 13px; border-radius:14px; border:1px solid var(--border); background:transparent; font-size:12px; color:var(--muted); white-space:nowrap; transition:all .15s; }
.type-btn:hover { border-color:var(--accent); color:var(--accent); }
.type-btn.active { background:var(--accent-light); border-color:var(--accent); color:var(--accent); font-weight:600; }

/* ── Layout ── */
.layout { display:flex; }
.sidebar { width:280px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border); overflow-y:auto; max-height:calc(100vh - 130px); position:sticky; top:130px; transition:width .2s; }
.sidebar.closed { width:0; overflow:hidden; border-right:none; }
.main { flex:1; min-width:0; padding:18px 20px; }

/* ── Source Selector ── */
.src-panel { padding:14px; }
.src-header { display:flex; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
.src-title { font-weight:700; font-size:14px; }
.src-count { font-size:12px; color:var(--muted); flex:1; }
.toggle-all { padding:3px 10px; border-radius:12px; border:1px solid var(--accent); color:var(--accent); background:transparent; font-size:12px; }
.toggle-all:hover { background:var(--accent-light); }
.src-list { display:flex; flex-direction:column; gap:5px; }
.src-item { display:flex; align-items:flex-start; gap:8px; padding:9px; border-radius:var(--radius); border:1px solid var(--border); background:var(--bg); cursor:pointer; flex-wrap:wrap; transition:border-color .15s,background .15s; }
.src-item:hover { border-color:var(--accent); }
.src-item.on { border-color:var(--accent); background:#f0f6ff; }
.src-item input[type=checkbox] { margin-top:2px; accent-color:var(--accent); flex-shrink:0; }
.src-flag { font-size:14px; }
.src-name { font-weight:600; font-size:13px; flex:1; }
.src-desc { font-size:11px; color:var(--muted); width:100%; margin-left:22px; }

/* ── Feed toolbar ── */
.feed-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:8px; flex-wrap:wrap; }
.feed-count { font-size:13px; color:var(--muted); }
.feed-actions { display:flex; gap:10px; align-items:center; }
.err-badge { font-size:12px; color:var(--error); padding:3px 10px; border-radius:12px; border:1px solid var(--error); cursor:help; }
.reload-btn { padding:5px 13px; border-radius:14px; border:1px solid var(--border); background:var(--surface); font-size:13px; }
.reload-btn:hover:not(:disabled) { background:var(--bg); }
.reload-btn:disabled { opacity:.5; cursor:not-allowed; }

/* ── Notice ── */
.notice { background:#fffbeb; border:1px solid #fcd34d; border-radius:var(--radius); padding:10px 14px; margin-bottom:14px; font-size:13px; color:#92400e; display:none; }

/* ── Article grid ── */
.article-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:14px; }
.skeleton-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:14px; }
.skeleton { height:155px; border-radius:var(--radius); background:linear-gradient(90deg,#e2e8f0 25%,#f1f5f9 50%,#e2e8f0 75%); background-size:200% 100%; animation:shimmer 1.4s infinite; }
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

/* ── Article card ── */
.card { display:flex; flex-direction:column; gap:7px; padding:15px; border-radius:var(--radius); border:1px solid var(--border); background:var(--surface); box-shadow:var(--shadow); transition:box-shadow .15s,border-color .15s,transform .1s; }
.card:hover { box-shadow:0 4px 14px rgba(0,0,0,.1); border-color:var(--accent); transform:translateY(-1px); }
.card-meta { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); }
.card-source { font-weight:600; }
.card-title { font-size:14px; font-weight:600; line-height:1.45; }
.card-desc { font-size:12px; color:var(--muted); line-height:1.5; }
.card-footer { display:flex; gap:5px; flex-wrap:wrap; margin-top:auto; }
.card-tag { font-size:10px; padding:2px 7px; border-radius:9px; background:var(--tag-bg); color:var(--tag-color); }
.card-prod-tag { font-size:10px; padding:2px 7px; border-radius:9px; background:#fef3c7; color:#92400e; font-weight:600; }
.card-type-tag { font-size:10px; padding:2px 7px; border-radius:9px; background:#f0fdf4; color:#166534; }
.card.demo { border-style:dashed; opacity:.8; }
.demo-label { font-size:10px; color:var(--muted); background:#f1f5f9; padding:1px 6px; border-radius:6px; align-self:flex-start; }

/* ── Site links tab ── */
.source-link-list { display:flex; flex-direction:column; gap:8px; }
.source-link-card { display:flex; align-items:center; gap:12px; padding:13px 15px; border-radius:var(--radius); border:1px solid var(--border); background:var(--surface); box-shadow:var(--shadow); transition:border-color .15s; }
.source-link-card:hover { border-color:var(--accent); }
.slc-flag { font-size:18px; }
.slc-info { flex:1; }
.slc-name { font-weight:700; font-size:14px; }
.slc-desc { font-size:12px; color:var(--muted); }
.slc-arrow { color:var(--muted); }

/* ── Empty ── */
.empty { text-align:center; padding:50px 20px; color:var(--muted); font-size:14px; }

/* ── Tab bar ── */
.tab-bar { display:flex; gap:4px; margin-bottom:14px; border-bottom:2px solid var(--border); }
.tab-btn { padding:7px 15px; border:none; background:transparent; font-size:14px; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-2px; transition:all .15s; }
.tab-btn.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }

/* ── Product legend ── */
.prod-legend { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
.legend-chip { font-size:11px; padding:3px 10px; border-radius:10px; background:#fef3c7; color:#92400e; border:1px solid #fde68a; }

@media(max-width:768px){
  .sidebar { display:none !important; }
  .brand-sub { display:none; }
  .main { padding:12px; }
  .article-grid { grid-template-columns:1fr; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="brand">
      <span class="brand-icon">💊</span>
      <h1 class="brand-title">Pfizer Product News Hub</h1>
      <span class="brand-sub">제품 관련 뉴스 모니터링</span>
    </div>
    <div class="search-wrap">
      <input class="search-input" type="search" placeholder="기사 검색..." id="searchInput" />
    </div>
    <button class="sidebar-toggle" id="sidebarToggle">◀ 소스</button>
  </div>
  <!-- Row 1: 제품 탭 -->
  <div class="filter-row" id="prodBar"></div>
  <!-- Row 2: 유형 탭 -->
  <div class="filter-row" id="typeBar"></div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="src-panel">
      <div class="src-header">
        <span class="src-title">뉴스 소스</span>
        <span class="src-count" id="srcCount"></span>
        <button class="toggle-all" id="toggleAll">전체 선택</button>
      </div>
      <div class="src-list" id="srcList"></div>
    </div>
  </aside>
  <main class="main">
    <div class="tab-bar">
      <button class="tab-btn active" id="tabFeed" onclick="switchTab('feed')">📰 뉴스 피드</button>
      <button class="tab-btn" id="tabLinks" onclick="switchTab('links')">🔗 사이트 바로가기</button>
    </div>

    <div id="noticeBanner" class="notice">
      ⚠ RSS를 자동으로 불러오지 못했습니다. 네트워크 또는 CORS 문제일 수 있습니다.
      <b>사이트 바로가기</b> 탭에서 직접 방문해 주세요.
    </div>

    <div id="panelFeed">
      <div class="prod-legend" id="prodLegend"></div>
      <div class="feed-bar">
        <span class="feed-count" id="feedCount">로딩 중...</span>
        <div class="feed-actions">
          <span class="err-badge" id="errBadge" style="display:none"></span>
          <button class="reload-btn" id="reloadBtn">새로고침</button>
        </div>
      </div>
      <div id="feedArea"></div>
    </div>

    <div id="panelLinks" style="display:none">
      <div class="source-link-list" id="linkList"></div>
    </div>
  </main>
</div>

<script>
// ═══════════════════════════════════════════════
//  제품 정의 — 브랜드명 / 성분명 / 관련 질환 키워드
// ═══════════════════════════════════════════════
const PRODUCTS = [
  {
    id: "all", name: "전체", generic: "모든 제품",
    keywords: [], // 전체는 하위 제품 키워드 합산
  },
  {
    id: "lipitor", name: "리피토", generic: "atorvastatin",
    color: "#fef3c7", textColor: "#92400e",
    keywords: [
      "리피토","lipitor","atorvastatin","아토르바스타틴","아토바스타틴",
      "이상지질혈증","고지혈증","스타틴","statin","콜레스테롤","cholesterol",
      "ldl","ldl-c","트리글리세라이드","triglyceride","동맥경화","atherosclerosis",
      "심혈관","cardiovascular","심근경색","myocardial infarction"
    ],
  },
  {
    id: "lipitorplus", name: "리피토플러스", generic: "atorvastatin/ezetimibe",
    color: "#fef3c7", textColor: "#92400e",
    keywords: [
      "리피토플러스","lipitor plus","에제티미브","ezetimibe",
      "이상지질혈증","고지혈증","스타틴","statin","콜레스테롤","cholesterol",
      "ldl","ldl-c","복합제","combination"
    ],
  },
  {
    id: "norvasc", name: "노바스크", generic: "amlodipine",
    color: "#dcfce7", textColor: "#166534",
    keywords: [
      "노바스크","norvasc","amlodipine","암로디핀","암로디핀베실산염",
      "고혈압","hypertension","협심증","angina","칼슘채널차단제","ccb",
      "calcium channel","혈압","blood pressure","심혈관","cardiovascular"
    ],
  },
  {
    id: "lyrica", name: "리리카", generic: "pregabalin",
    color: "#ede9fe", textColor: "#5b21b6",
    keywords: [
      "리리카","lyrica","pregabalin","프레가발린",
      "신경병증성 통증","neuropathic pain","신경통","neuropathy",
      "섬유근육통","fibromyalgia","뇌전증","간질","epilepsy","seizure",
      "대상포진 후 신경통","postherpetic neuralgia","당뇨병성 신경병증","diabetic neuropathy"
    ],
  },
  {
    id: "celebrex", name: "쎄레브렉스", generic: "celecoxib",
    color: "#fce7f3", textColor: "#9d174d",
    keywords: [
      "쎄레브렉스","celebrex","celecoxib","셀레콕시브","셀레브렉스",
      "골관절염","osteoarthritis","류마티스관절염","rheumatoid arthritis",
      "관절염","arthritis","cox-2","cox2","nsaid","nsaids","항염증",
      "통증","pain management","척추관절염","ankylosing spondylitis"
    ],
  },
  {
    id: "caduet", name: "카듀엣", generic: "amlodipine/atorvastatin",
    color: "#e0f2fe", textColor: "#0369a1",
    keywords: [
      "카듀엣","caduet","amlodipine","atorvastatin","암로디핀","아토르바스타틴",
      "고혈압","hypertension","이상지질혈증","고지혈증","심혈관","cardiovascular",
      "복합제","combination","혈압","blood pressure","콜레스테롤","cholesterol"
    ],
  },
];

// 전체 탭의 keywords = 모든 제품 키워드 합산
PRODUCTS[0].keywords = [...new Set(PRODUCTS.slice(1).flatMap(p=>p.keywords))];

// ═══════════════════════════════════════════════
//  유형 정의
// ═══════════════════════════════════════════════
const TYPES = [
  { id:"all",      label:"전체 유형" },
  { id:"disease",  label:"질환/임상",  keywords:["임상","치료","환자","질환","증상","처방","적응증","clinical","trial","patient","disease","efficacy","safety","치료제","요법"] },
  { id:"policy",   label:"정책/규제",  keywords:["급여","허가","식약처","fda","보험","정책","규제","심평원","급여기준","승인","approval","reimbursement","regulation","처방전","보험급여"] },
  { id:"research", label:"연구/학술",  keywords:["연구","학술","논문","발표","결과","데이터","study","research","journal","published","meta","analysis","guideline","가이드라인","학회"] },
];

// ═══════════════════════════════════════════════
//  뉴스 소스
// ═══════════════════════════════════════════════
const FLAGS = {KR:"🇰🇷",US:"🇺🇸"};
const SOURCES = [
  {id:"medigatenews",name:"메디게이트뉴스",  url:"https://www.medigatenews.com",  rss:"https://www.medigatenews.com/rss/all",            country:"KR",desc:"의약품·의료기기 전문 뉴스"},
  {id:"medicaltimes",name:"메디칼타임즈",    url:"https://www.medicaltimes.com",  rss:"https://www.medicaltimes.com/Main/RssNews.html", country:"KR",desc:"의료계 전문 신문"},
  {id:"docdocdoc",   name:"청년의사",        url:"https://www.docdocdoc.co.kr",   rss:"https://www.docdocdoc.co.kr/rss/allArticle.xml", country:"KR",desc:"의사 전문 뉴스 매체"},
  {id:"yakup",       name:"약업신문",        url:"https://www.yakup.com",         rss:"https://www.yakup.com/rss/rss.html",             country:"KR",desc:"약업계 전문 신문"},
  {id:"hitnews",     name:"히트뉴스",        url:"https://www.hitnews.co.kr",     rss:"https://www.hitnews.co.kr/rss/allArticle.xml",   country:"KR",desc:"제약·바이오 전문 뉴스"},
  {id:"biopharma",   name:"바이오스펙테이터",url:"https://www.biospectator.com",  rss:"https://www.biospectator.com/rss/rss.xml",       country:"KR",desc:"바이오·제약 전문 미디어"},
  {id:"pharmnews",   name:"팜뉴스",          url:"https://www.pharmnews.com",     rss:"https://www.pharmnews.com/rss/allArticle.xml",   country:"KR",desc:"제약·약업 뉴스"},
  {id:"medipana",    name:"메디파나뉴스",    url:"https://www.medipana.com",      rss:"https://www.medipana.com/rss/rss.xml",           country:"KR",desc:"제약·의료 종합 뉴스"},
  {id:"statnews",    name:"STAT News",       url:"https://www.statnews.com",      rss:"https://www.statnews.com/feed/",                 country:"US",desc:"Health & medicine reporting"},
  {id:"fiercepharma",name:"Fierce Pharma",   url:"https://www.fiercepharma.com", rss:"https://www.fiercepharma.com/rss/xml",           country:"US",desc:"Pharma industry news"},
  {id:"endpoints",   name:"Endpoints News",  url:"https://endpts.com",           rss:"https://endpts.com/feed/",                       country:"US",desc:"Biopharma news & analysis"},
  {id:"medscape",    name:"Medscape",        url:"https://www.medscape.com",     rss:"https://www.medscape.com/rss/allnews",           country:"US",desc:"Clinical & medical news"},
  {id:"reuters",     name:"Reuters Health",  url:"https://www.reuters.com/business/healthcare-pharmaceuticals",rss:"https://feeds.reuters.com/reuters/healthNews",country:"US",desc:"Global health & pharma news"},
];

const PROXIES = [
  url=>`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
  url=>`https://corsproxy.io/?${encodeURIComponent(url)}`,
  url=>`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
];

// ═══════════════════════════════════════════════
//  State
// ═══════════════════════════════════════════════
let activeProd = "all";
let activeType = "all";
let selectedSources = new Set(SOURCES.map(s=>s.id));
let searchQuery = "";
let articles = [];
let errors = {};
let lastUpdated = null;
let sidebarOpen = true;
let currentTab = "feed";

// ═══════════════════════════════════════════════
//  Init
// ═══════════════════════════════════════════════
renderProdBar();
renderTypeBar();
renderSources();
renderLinks();
renderProdLegend();
loadFeeds();

document.getElementById("searchInput").addEventListener("input",e=>{searchQuery=e.target.value;renderFeed();});
document.getElementById("reloadBtn").addEventListener("click",loadFeeds);
document.getElementById("toggleAll").addEventListener("click",toggleAll);
document.getElementById("sidebarToggle").addEventListener("click",()=>{
  sidebarOpen=!sidebarOpen;
  document.getElementById("sidebar").classList.toggle("closed",!sidebarOpen);
  document.getElementById("sidebarToggle").textContent=sidebarOpen?"◀ 소스":"▶ 소스";
});

function switchTab(tab){
  currentTab=tab;
  document.getElementById("panelFeed").style.display=tab==="feed"?"":"none";
  document.getElementById("panelLinks").style.display=tab==="links"?"":"none";
  document.getElementById("tabFeed").classList.toggle("active",tab==="feed");
  document.getElementById("tabLinks").classList.toggle("active",tab==="links");
}

// ═══════════════════════════════════════════════
//  Render filters
// ═══════════════════════════════════════════════
function renderProdBar(){
  const bar=document.getElementById("prodBar");
  bar.innerHTML="";
  PRODUCTS.forEach(p=>{
    const btn=document.createElement("button");
    btn.className="prod-btn"+(p.id===activeProd?" active":"");
    btn.innerHTML=`<span class="pname">${p.name}</span><span class="pgen">${p.generic}</span>`;
    btn.onclick=()=>{activeProd=p.id;renderProdBar();renderFeed();renderProdLegend();};
    bar.appendChild(btn);
  });
}

function renderTypeBar(){
  const bar=document.getElementById("typeBar");
  bar.innerHTML="";
  TYPES.forEach(t=>{
    const btn=document.createElement("button");
    btn.className="type-btn"+(t.id===activeType?" active":"");
    btn.textContent=t.id==="all"?"전체 유형":t.label;
    btn.onclick=()=>{activeType=t.id;renderTypeBar();renderFeed();};
    bar.appendChild(btn);
  });
}

function renderProdLegend(){
  const el=document.getElementById("prodLegend");
  el.innerHTML="";
  const prods = activeProd==="all" ? PRODUCTS.slice(1) : PRODUCTS.filter(p=>p.id===activeProd);
  prods.forEach(p=>{
    const chip=document.createElement("span");
    chip.className="legend-chip";
    chip.style.background=p.color||"#fef3c7";
    chip.style.color=p.textColor||"#92400e";
    chip.style.border=`1px solid ${p.color||"#fde68a"}`;
    chip.textContent=`${p.name} (${p.generic})`;
    el.appendChild(chip);
  });
}

function renderSources(){
  document.getElementById("srcCount").textContent=`${SOURCES.length}개`;
  const allOn=SOURCES.every(s=>selectedSources.has(s.id));
  document.getElementById("toggleAll").textContent=allOn?"전체 해제":"전체 선택";
  const list=document.getElementById("srcList");
  list.innerHTML="";
  SOURCES.forEach(src=>{
    const on=selectedSources.has(src.id);
    const item=document.createElement("label");
    item.className="src-item"+(on?" on":"");
    item.innerHTML=`
      <input type="checkbox" ${on?"checked":""} />
      <span class="src-flag">${FLAGS[src.country]||""}</span>
      <span class="src-name">${src.name}</span>
      <span class="src-desc">${src.desc}</span>
    `;
    item.querySelector("input").addEventListener("change",e=>{
      if(e.target.checked)selectedSources.add(src.id);else selectedSources.delete(src.id);

function renderLinks(){
  const list=document.getElementById("linkList");

    const card=document.createElement("a");

    card.href=src.url; card.target="_blank"; card.rel="noopener noreferrer";

function toggleAll(){
  const allOn=SOURCES.every(s=>selectedSources.has(s.id));
  SOURCES.forEach(s=>allOn?selectedSources.delete(s.id):selectedSources.add(s.id));
  renderSources();renderFeed();
}

// ═══════════════════════════════════════════════
//  키워드 매칭 유틸
// ═══════════════════════════════════════════════
function matchesKeywords(text, keywords){
  const t=text.toLowerCase();
  return keywords.some(k=>t.includes(k.toLowerCase()));
}

// 기사가 어떤 제품에 해당하는지 찾기
function detectProducts(text){
  return PRODUCTS.slice(1).filter(p=>matchesKeywords(text,p.keywords));
}

// 기사 유형 감지
function detectType(text){
  for(const t of TYPES.slice(1)){
    if(matchesKeywords(text,t.keywords)) return t.id;
  }
  return "disease"; // 기본값
}

// ═══════════════════════════════════════════════
//  RSS Fetch
// ═══════════════════════════════════════════════
async function fetchWithProxy(rssUrl){
  for(const makeProxy of PROXIES){
    try{
      const res=await fetch(makeProxy(rssUrl),{signal:AbortSignal.timeout(9000)});
      if(!res.ok) continue;
      const data=await res.json();
      const text=data.contents||data.data||data;
      if(typeof text!=="string"||!text.includes("<item>")) continue;
      return text;
    } catch(e){ continue; }
  }
  throw new Error("모든 프록시 실패");
}

async function fetchRss(source){
  const text=await fetchWithProxy(source.rss);
  const xml=new DOMParser().parseFromString(text,"text/xml");
  if(xml.querySelector("parsererror")) throw new Error("XML 파싱 오류");

  return [...xml.querySelectorAll("item")].slice(0,15).map(item=>{
    const g=tag=>item.querySelector(tag)?.textContent?.trim()??"";
    const pd=g("pubDate");
    const title=g("title");
    const desc=g("description").replace(/<[^>]+>/g,"").replace(/\s+/g," ").trim().slice(0,200);
    const fullText=(title+" "+desc).toLowerCase();

    // 마스터 키워드 필터 — 전체 제품 키워드에 해당하지 않으면 제외
    if(!matchesKeywords(fullText, PRODUCTS[0].keywords)) return null;

    const matchedProds=detectProducts(fullText);
    const articleType=detectType(fullText);

    return {
      id:g("guid")||g("link"),
      title,
      link:g("link"),
      desc,
      date:pd?new Date(pd):new Date(),
      sourceId:source.id, sourceName:source.name, country:source.country,
      matchedProds,   // 매칭된 제품 배열
      articleType,    // disease | policy | research
      demo:false,
    };
  }).filter(Boolean).filter(a=>a.title&&a.link);
}

async function loadFeeds(){
  const sources=SOURCES.filter(s=>selectedSources.has(s.id));
  if(!sources.length){renderFeed();return;}
  errors={};
  document.getElementById("feedArea").innerHTML=`<div class="skeleton-grid">${Array(6).fill('<div class="skeleton"></div>').join("")}</div>`;
  document.getElementById("reloadBtn").disabled=true;
  document.getElementById("feedCount").textContent="뉴스 불러오는 중...";
  document.getElementById("noticeBanner").style.display="none";

  const results=await Promise.allSettled(sources.map(fetchRss));
  const newArticles=[];
  results.forEach((r,i)=>{
    if(r.status==="fulfilled") newArticles.push(...r.value);
    else errors[sources[i].id]=r.reason?.message??"실패";
  });
  newArticles.sort((a,b)=>b.date-a.date);
  articles=newArticles;
  lastUpdated=new Date();

  if(newArticles.length===0){
    document.getElementById("noticeBanner").style.display="";
    articles=DEMO_ARTICLES;
  }
  renderFeed();
}

// ═══════════════════════════════════════════════
//  Render Feed
// ═══════════════════════════════════════════════
function timeAgo(date){
  const d=(Date.now()-date.getTime())/1000;
  if(isNaN(d)||d<0) return "";
  if(d<60) return "방금 전";
  if(d<3600) return Math.floor(d/60)+"분 전";
  if(d<86400) return Math.floor(d/3600)+"시간 전";
  return Math.floor(d/86400)+"일 전";
}

function renderFeed(){
  const errCount=Object.keys(errors).length;
  const errBadge=document.getElementById("errBadge");
  if(errCount&&articles.length>0&&!articles[0].demo){
    errBadge.style.display="";
    errBadge.textContent=`⚠ ${errCount}개 소스 오류`;
    errBadge.title=Object.entries(errors).map(([k,v])=>`${k}: ${v}`).join("\n");
  } else errBadge.style.display="none";

  let list=articles.filter(a=>selectedSources.has(a.sourceId)||a.demo);

  // 제품 필터
  if(activeProd!=="all"){
    list=list.filter(a=>a.demo||a.matchedProds.some(p=>p.id===activeProd));
  }

  // 유형 필터
  if(activeType!=="all"){
    list=list.filter(a=>a.demo||a.articleType===activeType);
  }

  // 검색어 필터
  if(searchQuery.trim()){
    const q=searchQuery.toLowerCase();
    list=list.filter(a=>a.title.toLowerCase().includes(q)||a.desc.toLowerCase().includes(q));
  }

  const upd=lastUpdated?` · ${lastUpdated.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})} 업데이트`:"";
  document.getElementById("feedCount").textContent=`${list.length}개 기사${upd}`;
  document.getElementById("reloadBtn").disabled=false;

  const area=document.getElementById("feedArea");
  if(!list.length){
    area.innerHTML=`<div class="empty">${
      selectedSources.size===0?"뉴스 소스를 1개 이상 선택하세요.":
      "선택한 조건에 해당하는 기사가 없습니다.<br><small>제품·유형 필터를 변경하거나 새로고침해 보세요.</small>"
    }</div>`;
    return;
  }

  const grid=document.createElement("div");
  grid.className="article-grid";
  list.forEach(a=>{
    const typeLabel=TYPES.find(t=>t.id===a.articleType)?.label??"";
    const prodTags=(a.matchedProds||[]).map(p=>`<span class="card-prod-tag" style="background:${p.color};color:${p.textColor}">${p.name}</span>`).join("");
    const card=document.createElement("a");
    card.className="card"+(a.demo?" demo":"");
    card.href=a.link; card.target="_blank"; card.rel="noopener noreferrer";
    card.innerHTML=`
      ${a.demo?'<span class="demo-label">샘플 미리보기</span>':""}
      <div class="card-meta">
        <span class="card-source">${FLAGS[a.country]||""} ${a.sourceName}</span>
        <span>${timeAgo(a.date)}</span>
      </div>
      <div class="card-title">${a.title}</div>
      ${a.desc?`<div class="card-desc">${a.desc}…</div>`:""}
      <div class="card-footer">
        ${prodTags}
        ${typeLabel?`<span class="card-type-tag">${typeLabel}</span>`:""}
      </div>
    `;
    grid.appendChild(card);
  });
  area.innerHTML=""; area.appendChild(grid);
}
