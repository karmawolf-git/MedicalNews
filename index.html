<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product News Hub</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f4f6fb; --surface: #fff; --border: #e2e8f0;
  --text: #1e293b; --muted: #64748b;
  --accent: #0050a0; --accent-light: #e8f0fb;
  --error: #ef4444; --radius: 10px; --shadow: 0 1px 4px rgba(0,0,0,.08);
}
body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; background:var(--bg); color:var(--text); font-size:14px; line-height:1.6; }
a { color:inherit; text-decoration:none; }
button { cursor:pointer; font-family:inherit; }
input { font-family:inherit; }

.header { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); box-shadow:var(--shadow); }
.header-inner { display:flex; align-items:center; gap:14px; padding:12px 20px; flex-wrap:wrap; }
.brand { display:flex; align-items:center; gap:8px; flex-shrink:0; }
.brand-icon { font-size:22px; }
.brand-title { font-size:17px; font-weight:700; color:var(--accent); }
.brand-sub { font-size:12px; color:var(--muted); }
.search-wrap { flex:1; min-width:160px; max-width:320px; }
.search-input { width:100%; padding:7px 14px; border:1px solid var(--border); border-radius:20px; font-size:14px; background:var(--bg); outline:none; }
.search-input:focus { border-color:var(--accent); }
.hdr-right { display:flex; gap:8px; align-items:center; }
.sidebar-toggle { padding:6px 13px; border-radius:20px; border:1px solid var(--border); background:var(--bg); font-size:13px; color:var(--muted); white-space:nowrap; }
.sidebar-toggle:hover { background:var(--border); }

/* ── Product tabs ── */
.filter-row { display:flex; gap:6px; padding:8px 18px; overflow-x:auto; scrollbar-width:none; border-top:1px solid var(--border); }
.filter-row::-webkit-scrollbar { display:none; }
.filter-row.type-row { padding-top:4px; padding-bottom:8px; border-top:none; }

.prod-btn { display:flex; flex-direction:column; align-items:center; padding:5px 13px; border-radius:16px; border:1px solid var(--border); background:transparent; font-size:12px; color:var(--muted); white-space:nowrap; transition:all .15s; line-height:1.3; }
.prod-btn .pname { font-weight:700; font-size:13px; }
.prod-btn .pgen  { font-size:10px; opacity:.7; }
.prod-btn:hover { border-color:var(--accent); color:var(--accent); }
.prod-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }
.prod-btn.active .pgen { opacity:.85; }

.type-btn { padding:3px 12px; border-radius:14px; border:1px solid var(--border); background:transparent; font-size:12px; color:var(--muted); white-space:nowrap; transition:all .15s; }
.type-btn:hover { border-color:var(--accent); color:var(--accent); }
.type-btn.active { background:var(--accent-light); border-color:var(--accent); color:var(--accent); font-weight:600; }

/* ── Layout ── */
.layout { display:flex; }
.sidebar { width:270px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border); overflow-y:auto; max-height:calc(100vh - 130px); position:sticky; top:130px; transition:width .2s; }
.sidebar.closed { width:0; overflow:hidden; border-right:none; }
.main { flex:1; min-width:0; padding:16px 20px; }

/* ── Source panel ── */
.src-panel { padding:12px; }
.src-header { display:flex; align-items:center; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
.src-title { font-weight:700; font-size:13px; }
.src-count { font-size:11px; color:var(--muted); flex:1; }
.toggle-all { padding:3px 9px; border-radius:11px; border:1px solid var(--accent); color:var(--accent); background:transparent; font-size:11px; }
.toggle-all:hover { background:var(--accent-light); }
.src-list { display:flex; flex-direction:column; gap:5px; }
.src-item { display:flex; align-items:flex-start; gap:7px; padding:8px; border-radius:var(--radius); border:1px solid var(--border); background:var(--bg); cursor:pointer; flex-wrap:wrap; transition:border-color .15s,background .15s; }
.src-item:hover { border-color:var(--accent); }
.src-item.on { border-color:var(--accent); background:#f0f6ff; }
.src-item input { margin-top:2px; accent-color:var(--accent); flex-shrink:0; }
.src-flag { font-size:14px; }
.src-name { font-weight:600; font-size:12px; flex:1; }
.src-desc { font-size:10px; color:var(--muted); width:100%; margin-left:20px; line-height:1.4; }
.src-query { font-size:9px; color:var(--muted); width:100%; margin-left:20px; opacity:.7; margin-top:1px; }

/* ── Feed bar ── */
.feed-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:8px; flex-wrap:wrap; }
.feed-count { font-size:13px; color:var(--muted); }
.feed-actions { display:flex; gap:8px; align-items:center; }
.err-badge { font-size:12px; color:var(--error); padding:3px 10px; border-radius:12px; border:1px solid var(--error); cursor:help; }
.reload-btn { padding:5px 12px; border-radius:14px; border:1px solid var(--border); background:var(--surface); font-size:13px; }
.reload-btn:hover:not(:disabled) { background:var(--bg); }
.reload-btn:disabled { opacity:.5; cursor:not-allowed; }

.notice { background:#fffbeb; border:1px solid #fcd34d; border-radius:var(--radius); padding:10px 14px; margin-bottom:12px; font-size:13px; color:#92400e; display:none; }

/* ── Grid ── */
.article-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:13px; }
.skeleton-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:13px; }
.skeleton { height:150px; border-radius:var(--radius); background:linear-gradient(90deg,#e2e8f0 25%,#f1f5f9 50%,#e2e8f0 75%); background-size:200% 100%; animation:shimmer 1.4s infinite; }
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

/* ── Card ── */
.card { display:flex; flex-direction:column; gap:7px; padding:14px; border-radius:var(--radius); border:1px solid var(--border); background:var(--surface); box-shadow:var(--shadow); transition:box-shadow .15s,border-color .15s,transform .1s; }
.card:hover { box-shadow:0 4px 14px rgba(0,0,0,.1); border-color:var(--accent); transform:translateY(-1px); }
.card-meta { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); }
.card-source { font-weight:600; }
.card-title { font-size:14px; font-weight:600; line-height:1.45; }
.card-desc { font-size:12px; color:var(--muted); line-height:1.5; }
.card-footer { display:flex; gap:4px; flex-wrap:wrap; margin-top:auto; }
.tag-prod { font-size:10px; padding:2px 7px; border-radius:9px; font-weight:600; }
.tag-type { font-size:10px; padding:2px 7px; border-radius:9px; background:#f0fdf4; color:#166534; }
.tag-class { font-size:10px; padding:2px 7px; border-radius:9px; background:#f5f3ff; color:#6d28d9; }
.card.demo { border-style:dashed; opacity:.8; }
.demo-label { font-size:10px; color:var(--muted); background:#f1f5f9; padding:1px 6px; border-radius:6px; align-self:flex-start; }

/* ── Links tab ── */
.source-link-list { display:flex; flex-direction:column; gap:8px; }
.slc { display:flex; align-items:center; gap:12px; padding:13px 15px; border-radius:var(--radius); border:1px solid var(--border); background:var(--surface); box-shadow:var(--shadow); transition:border-color .15s; }
.slc:hover { border-color:var(--accent); }
.slc-flag { font-size:16px; }
.slc-info { flex:1; }
.slc-name { font-weight:700; font-size:13px; }
.slc-desc { font-size:11px; color:var(--muted); }
.slc-query { font-size:10px; color:#6366f1; margin-top:2px; }
.slc-arrow { color:var(--muted); }

.empty { text-align:center; padding:50px 20px; color:var(--muted); font-size:14px; }

/* ── Tab bar ── */
.tab-bar { display:flex; gap:4px; margin-bottom:13px; border-bottom:2px solid var(--border); }
.tab-btn { padding:7px 14px; border:none; background:transparent; font-size:14px; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-2px; transition:all .15s; }
.tab-btn.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }

/* ── Legend chips ── */
.prod-legend { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:12px; }
.legend-chip { font-size:11px; padding:3px 10px; border-radius:10px; border:1px solid; }

@media(max-width:768px){
  .sidebar { display:none !important; }
  .brand-sub { display:none; }
  .main { padding:12px; }
  .article-grid { grid-template-columns:1fr; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="brand">
      <span class="brand-icon">💊</span>
      <h1 class="brand-title">Product News Hub</h1>
      <span class="brand-sub">제품 관련 뉴스 모니터링</span>
    </div>
    <div class="search-wrap">
      <input class="search-input" type="search" placeholder="기사 검색..." id="searchInput" />
    </div>
    <div class="hdr-right">
      <button class="sidebar-toggle" id="sidebarToggle">◀ 소스</button>
    </div>
  </div>
  <div class="filter-row" id="prodBar"></div>
  <div class="filter-row type-row" id="typeBar"></div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="src-panel">
      <div class="src-header">
        <span class="src-title">뉴스 소스</span>
        <span class="src-count" id="srcCount"></span>
        <button class="toggle-all" id="toggleAll">전체</button>
      </div>
      <div class="src-list" id="srcList"></div>
    </div>
  </aside>
  <main class="main">
    <div class="tab-bar">
      <button class="tab-btn active" id="tabFeed" onclick="switchTab('feed')">📰 뉴스 피드</button>
      <button class="tab-btn" id="tabLinks" onclick="switchTab('links')">🔗 소스 목록</button>
    </div>
    <div id="noticeBanner" class="notice">
      ⚠ Google News RSS를 불러오지 못했습니다. 네트워크 상태를 확인하거나 잠시 후 새로고침 해주세요.
    </div>
    <div id="panelFeed">
      <div class="prod-legend" id="prodLegend"></div>
      <div class="feed-bar">
        <span class="feed-count" id="feedCount">로딩 중...</span>
        <div class="feed-actions">
          <span class="err-badge" id="errBadge" style="display:none"></span>
          <button class="reload-btn" id="reloadBtn">새로고침</button>
        </div>
      </div>
      <div id="feedArea"></div>
    </div>
    <div id="panelLinks" style="display:none">
      <div class="source-link-list" id="linkList"></div>
    </div>
  </main>
</div>

function includes(text, kws){ const t=text.toLowerCase(); return kws.some(k=>t.includes(k.toLowerCase())); }

function detectProds(text){
  return PRODUCTS.slice(1).filter(p=>
    includes(text,[...p.brandKw,...p.classKw,...p.competKw,...p.diseaseKw])
  );
}
function detectClasses(text){
  return PRODUCTS.slice(1).filter(p=>includes(text,[...p.classKw,...p.competKw]));
}
function detectType(text){
  for(const t of TYPES.slice(1)){ if(includes(text,t.kw)) return t.id; }
  return "disease";
}

// ══════════════════════════════════════════════════════════
//  RSS Fetch
// ══════════════════════════════════════════════════════════
async function fetchWithProxy(url){
  for(const mk of PROXIES){
    try{
      const r=await fetch(mk(url),{signal:AbortSignal.timeout(10000)});
      if(!r.ok) continue;
      const d=await r.json();
      const txt=d.contents||d.data||"";
      if(typeof txt==="string"&&(txt.includes("<item>")||txt.includes("<entry>"))) return txt;
    }catch(e){ continue; }
  }
  throw new Error("프록시 연결 실패");
}

async function fetchRss(src){
  const text=await fetchWithProxy(src.rss);
  const xml=new DOMParser().parseFromString(text,"text/xml");
  if(xml.querySelector("parsererror")) throw new Error("XML 오류");
  return [...xml.querySelectorAll("item")].slice(0,15).map(item=>{
    const g=tag=>item.querySelector(tag)?.textContent?.trim()??"";
    const title=g("title");
    const desc=g("description").replace(/<[^>]+>/g,"").replace(/\s+/g," ").trim().slice(0,200);
    const full=(title+" "+desc).toLowerCase();
    // 마스터 필터 — 제품/계열/질환 키워드 없으면 제외
    if(!includes(full, PRODUCTS[0].allKw)) return null;
    return {
      id:g("guid")||g("link"),
      title, link:g("link"), desc,
      date: (()=>{ const d=g("pubDate"); return d?new Date(d):new Date(); })(),
      sourceId:src.id, sourceName:src.name, country:src.country,
      matchedProds: detectProds(full),
      matchedClasses: detectClasses(full),
      articleType: detectType(full),
      demo:false,
    };
  }).filter(a=>a&&a.title&&a.link);
}

async function loadFeeds(){
  const sources=SOURCES.filter(s=>selectedSources.has(s.id));
  if(!sources.length){renderFeed();return;}
  errors={};
  document.getElementById("feedArea").innerHTML=`<div class="skeleton-grid">${Array(6).fill('<div class="skeleton"></div>').join("")}</div>`;
  document.getElementById("reloadBtn").disabled=true;
  document.getElementById("feedCount").textContent="로딩 중...";
  document.getElementById("noticeBanner").style.display="none";

  const results=await Promise.allSettled(sources.map(fetchRss));
  const raw=[];
  results.forEach((r,i)=>{
    if(r.status==="fulfilled") raw.push(...r.value);
    else errors[sources[i].id]=r.reason?.message??"실패";
  });

  // 중복 링크 제거
  const seen=new Set();
  const uniq=raw.filter(a=>{ if(seen.has(a.link)) return false; seen.add(a.link); return true; });
  uniq.sort((a,b)=>b.date-a.date);
  articles=uniq; lastUpdated=new Date();

  if(articles.length===0){
    document.getElementById("noticeBanner").style.display="";
    articles=DEMO_ARTICLES;
  }
  renderSources(); // 소스 패널 갱신 (체크 상태 유지)
  renderFeed();
}

function timeAgo(d){
  const s=(Date.now()-d.getTime())/1000;
  if(isNaN(s)||s<0) return "";
  if(s<60) return "방금 전";
  if(s<3600) return Math.floor(s/60)+"분 전";
  if(s<86400) return Math.floor(s/3600)+"시간 전";
  return Math.floor(s/86400)+"일 전";
}

function renderFeed(){
  const ec=Object.keys(errors).length;
  const eb=document.getElementById("errBadge");
  if(ec&&articles.length&&!articles[0].demo){
    eb.style.display=""; eb.textContent=`⚠ ${ec}개 소스 오류`;
    eb.title=Object.entries(errors).map(([k,v])=>`${k}: ${v}`).join("\n");
  } else eb.style.display="none";

  let list=articles.filter(a=>selectedSources.has(a.sourceId)||a.demo);

  if(activeProd!=="all"){
    list=list.filter(a=>a.demo||a.matchedProds.some(p=>p.id===activeProd));
  }
  if(activeType!=="all"){
    list=list.filter(a=>a.demo||a.articleType===activeType);
  }
  if(searchQuery.trim()){
    const q=searchQuery.toLowerCase();
    list=list.filter(a=>a.title.toLowerCase().includes(q)||a.desc.toLowerCase().includes(q));
  }

  const upd=lastUpdated?` · ${lastUpdated.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})} 업데이트`:"";
  document.getElementById("feedCount").textContent=`${list.length}개 기사${upd}`;
  document.getElementById("reloadBtn").disabled=false;

  const area=document.getElementById("feedArea");
  if(!list.length){
    area.innerHTML=`<div class="empty">${
      selectedSources.size===0?"뉴스 소스를 선택하세요.":
      "조건에 맞는 기사가 없습니다.<br><small>다른 제품·유형 탭을 선택하거나 새로고침해 보세요.</small>"
    }</div>`;
    return;
  }

  const grid=document.createElement("div"); grid.className="article-grid";
  const FLAGS={KR:"🇰🇷",US:"🇺🇸"};
  list.forEach(a=>{
    const typeLabel=TYPES.find(t=>t.id===a.articleType)?.label??"";
    const prodTags=(a.matchedProds||[]).slice(0,3).map(p=>
      `<span class="tag-prod" style="background:${p.color};color:${p.textColor}">${p.name}</span>`
    ).join("");
    const classTags=(a.matchedClasses||[]).slice(0,2).map(p=>
      `<span class="tag-class">${p.classLabel}</span>`
    ).join("");
    const card=document.createElement("a");
    card.className="card"+(a.demo?" demo":"");
    card.href=a.link; card.target="_blank"; card.rel="noopener noreferrer";
    card.innerHTML=`
      ${a.demo?'<span class="demo-label">샘플</span>':""}
      <div class="card-meta">
        <span class="card-source">${FLAGS[a.country]||""} ${a.sourceName}</span>
        <span>${timeAgo(a.date)}</span>
      </div>
      <div class="card-title">${a.title}</div>
      ${a.desc?`<div class="card-desc">${a.desc}…</div>`:""}
      <div class="card-footer">
        ${prodTags}${classTags}
        ${typeLabel?`<span class="tag-type">${typeLabel}</span>`:""}
      </div>
    `;
    grid.appendChild(card);
  });
  area.innerHTML=""; area.appendChild(grid);
}
